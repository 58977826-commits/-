project_types:
- 项目类型ID: PT-WP
  项目类型名称: 工作手机
  适用场景: 企业员工配发工作号码+终端
  典型服务范围: 号卡/资产/账务/事件/月报
  主要风险: 离职仍出账、超套、资产未归还
- 项目类型ID: PT-CARD
  项目类型名称: 单卡
  适用场景: 仅号卡无终端或轻终端
  典型服务范围: 号卡/账务/事件
  主要风险: 销号不及时、超套
- 项目类型ID: PT-CARD-DEV
  项目类型名称: 卡+终端
  适用场景: 号卡与终端绑定派发
  典型服务范围: 号卡/资产/账务/售后
  主要风险: 终端丢失、赔偿争议
- 项目类型ID: PT-LEASE
  项目类型名称: 终端租赁
  适用场景: 租赁模式终端全生命周期
  典型服务范围: 资产/库存/维修/账务
  主要风险: 到期未归还、库存积压
- 项目类型ID: PT-REPLACE
  项目类型名称: 换新管理
  适用场景: 周期性设备换新
  典型服务范围: 资产/事件/库存
  主要风险: 旧机未回收、数据擦除缺失
- 项目类型ID: PT-OPT
  项目类型名称: 存量优化
  适用场景: 既有 fleet 降本增效
  典型服务范围: 账务/用量/套餐优化
  主要风险: 零用量仍计费、套餐不匹配
