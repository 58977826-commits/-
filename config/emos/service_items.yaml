service_items:
- 服务项ID: SI-PM
  服务模块: 项目管理
  服务项名称: 项目启动与RACI
  说明: 明确甲乙双方职责与沟通机制
  是否必选: true
  适用条件: all
- 服务项ID: SI-SIM
  服务模块: 号卡管理
  服务项名称: 新入职配号
  说明: SIM/号码申请、开通、绑定
  是否必选: false
  适用条件: has_sim
- 服务项ID: SI-SIM-OFF
  服务模块: 号卡管理
  服务项名称: 离职销号/转个人
  说明: 号码处理方式确认与执行
  是否必选: false
  适用条件: has_sim
- 服务项ID: SI-ASSET-IN
  服务模块: 资产管理
  服务项名称: 新入职设备派发
  说明: 终端选型、派发、签收
  是否必选: false
  适用条件: has_terminal
- 服务项ID: SI-ASSET-OUT
  服务模块: 资产管理
  服务项名称: 离职设备归还
  说明: 回收、检测、库存更新
  是否必选: false
  适用条件: has_terminal
- 服务项ID: SI-INV
  服务模块: 库存管理
  服务项名称: 库存设备处理
  说明: 二次派发、报废、赔偿
  是否必选: false
  适用条件: has_inventory
- 服务项ID: SI-REPAIR
  服务模块: 售后管理
  服务项名称: 维修与换机
  说明: 报修、备机、完工闭环
  是否必选: false
  适用条件: has_terminal
- 服务项ID: SI-BILL
  服务模块: 账务管理
  服务项名称: 账单整理与异常
  说明: TEM账单核对、超套、离职后计费
  是否必选: false
  适用条件: has_billing
- 服务项ID: SI-CC
  服务模块: 账务管理
  服务项名称: 成本中心分摊
  说明: BU/部门费用分摊规则
  是否必选: false
  适用条件: has_billing
- 服务项ID: SI-EVENT
  服务模块: 事件运营
  服务项名称: 月度事件闭环
  说明: 改号、副卡、套餐变更等事件跟踪
  是否必选: false
  适用条件: has_event
- 服务项ID: SI-HELPDESK
  服务模块: 服务台
  服务项名称: 用户服务台支持
  说明: 工单受理与SLA
  是否必选: false
  适用条件: has_helpdesk
- 服务项ID: SI-ONSITE
  服务模块: 驻场服务
  服务项名称: 驻场运营
  说明: 现场支持、取件、培训
  是否必选: false
  适用条件: has_onsite
- 服务项ID: SI-REPORT
  服务模块: 月报管理
  服务项名称: 客户月报
  说明: 管理价值摘要与数据报表
  是否必选: true
  适用条件: all
