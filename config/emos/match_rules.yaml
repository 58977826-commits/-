match_rules:
- 规则ID: MR-001
  条件表达式: has_sim
  推荐服务项: SI-SIM,SI-SIM-OFF
  推荐组件: SOP-001,SOP-101,SOP-301,SOP-401
  推荐理由: 项目涉及号卡，需配号与销号流程
  关联风险: 离职销号不及时导致继续出账
  优先级: 10
- 规则ID: MR-002
  条件表达式: has_terminal
  推荐服务项: SI-ASSET-IN,SI-ASSET-OUT,SI-REPAIR
  推荐组件: SOP-002,SOP-101,SOP-401,SOP-404
  推荐理由: 项目涉及终端，需派发/归还/维修流程
  关联风险: 设备未归还、赔偿争议
  优先级: 10
- 规则ID: MR-003
  条件表达式: has_billing
  推荐服务项: SI-BILL,SI-CC
  推荐组件: SOP-103,RULE-101,RULE-301,SOP-403
  推荐理由: 项目涉及账务，需TEM对账与异常规则
  关联风险: 超套、零用量、离职后计费
  优先级: 10
- 规则ID: MR-004
  条件表达式: has_inventory
  推荐服务项: SI-INV
  推荐组件: RULE-001,SOP-201,SOP-107
  推荐理由: 项目涉及库存管理
  关联风险: 库存积压、错误二次派发
  优先级: 20
- 规则ID: MR-005
  条件表达式: has_event
  推荐服务项: SI-EVENT
  推荐组件: TPL-002,SOP-104,SOP-004,RULE-402
  推荐理由: 项目涉及事件运营闭环
  关联风险: 改号/变更未闭环
  优先级: 20
- 规则ID: MR-006
  条件表达式: has_helpdesk
  推荐服务项: SI-HELPDESK
  推荐组件: SOP-106,SOP-405
  推荐理由: 项目需要服务台支持
  关联风险: SLA不达标
  优先级: 30
- 规则ID: MR-007
  条件表达式: has_onsite
  推荐服务项: SI-ONSITE
  推荐组件: SOP-006,SOP-305
  推荐理由: 项目需要驻场服务
  关联风险: 取件/培训不到位
  优先级: 30
- 规则ID: MR-008
  条件表达式: project_type:终端租赁
  推荐服务项: SI-INV,SI-ASSET-OUT
  推荐组件: SOP-201,SOP-202,RULE-201
  推荐理由: 租赁类项目需入库与到期回收
  关联风险: 到期未回收
  优先级: 15
- 规则ID: MR-009
  条件表达式: project_type:存量优化
  推荐服务项: SI-BILL
  推荐组件: RULE-101,RULE-301,RULE-401
  推荐理由: 存量优化侧重用量与费用分析
  关联风险: 优化建议未落地
  优先级: 15
- 规则ID: MR-010
  条件表达式: source:GEHC
  推荐服务项: SI-REPORT
  推荐组件: RPT-001,TPL-001,TPL-002
  推荐理由: GE样板项目组件
  关联风险: 需项目化确认差异
  优先级: 50
- 规则ID: MR-011
  条件表达式: source:强生MT
  推荐服务项: SI-REPORT
  推荐组件: RPT-101,CASE-101,TPL-102
  推荐理由: 强生MT样板组件
  关联风险: 联通账单结构差异
  优先级: 50
- 规则ID: MR-012
  条件表达式: source:礼来
  推荐服务项: SI-REPORT
  推荐组件: RPT-301,TPL-301,CASE-301
  推荐理由: 礼来样板组件
  关联风险: 账期Gate需确认
  优先级: 50
- 规则ID: MR-013
  条件表达式: source:西安杨森
  推荐服务项: SI-REPORT
  推荐组件: RPT-401,TPL-401
  推荐理由: 杨森样板组件
  关联风险: BU分摊需确认
  优先级: 50
- 规则ID: MR-014
  条件表达式: always
  推荐服务项: SI-PM,SI-REPORT
  推荐组件: SOP-501,TPL-501,TPL-102
  推荐理由: 所有项目必备项目管理与月报框架
  关联风险: 范围与RACI未确认
  优先级: 5
- 规则ID: MR-015
  条件表达式: has_billing
  推荐服务项: SI-BILL
  推荐组件: RULE-501
  推荐理由: TEM数据导入需Import Gate
  关联风险: 字段映射错误阻断导入
  优先级: 12
