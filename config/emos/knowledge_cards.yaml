knowledge_cards:
- 知识卡片编号: KC-001
  主题: 库存设备再派发判断
  核心结论: 二次派发不能只看设备是否完好，还要看机型、归属、距到期时间、维修状态和客户策略。
  适用场景: 终端租赁,工作手机,离职归还
  来源项目: GEHC
  关联组件: RULE-001,SOP-002
  AI使用方式: 同类项目配置时主动提醒确认库存再派发规则
  是否可复用: true
- 知识卡片编号: KC-002
  主题: 联通账单双sheet结构
  核心结论: 联通账单workbook通常分清单与明细sheet，无关键字时不得默认当清单处理。
  适用场景: 工作手机,账务导入
  来源项目: 强生MT
  关联组件: CASE-101,SOP-103
  AI使用方式: 推荐账单组件时提示sheet识别规则
  是否可复用: true
- 知识卡片编号: KC-003
  主题: 离职后计费拦截
  核心结论: 离职日期早于账期末且实际应收>0需进入异常清单，容忍天数需项目确认。
  适用场景: 工作手机,单卡
  来源项目: GEHC
  关联组件: RULE-002
  AI使用方式: 风险审查时检查离职计费规则是否配置
  是否可复用: true
- 知识卡片编号: KC-004
  主题: 零用量长期闲置
  核心结论: 连续3个月零用量但仍计费应进入优化清单，需与客户确认是否销号或改套餐。
  适用场景: 存量优化,工作手机
  来源项目: 强生MT
  关联组件: RULE-101,RULE-401
  AI使用方式: 存量优化项目自动推荐相关规则组件
  是否可复用: true
- 知识卡片编号: KC-005
  主题: Import Gate strict模式
  核心结论: Excel内账期/客户与上下文不一致时strict模式阻断写库，差异应记入project_diff。
  适用场景: TEM导入,礼来
  来源项目: 礼来
  关联组件: CASE-301,RULE-501
  AI使用方式: 落地包生成时加入Gate检查清单
  是否可复用: true
- 知识卡片编号: KC-006
  主题: 成本中心变更映射
  核心结论: 组织架构变更时BU-Department映射需同步更新员工表与分摊规则。
  适用场景: 工作手机,成本中心
  来源项目: 西安杨森
  关联组件: CASE-401,RULE-102
  AI使用方式: 涉及分摊的项目提示确认映射表
  是否可复用: true
- 知识卡片编号: KC-007
  主题: 事件未闭环管理
  核心结论: On-Boarding等开放状态超过SLA需升级，事件字典需与ITSM口径对齐。
  适用场景: 工作手机,事件运营
  来源项目: 西安杨森
  关联组件: RULE-402,TPL-002
  AI使用方式: 推荐事件模块时附带状态定义检查
  是否可复用: true
- 知识卡片编号: KC-008
  主题: 超套5%预警
  核心结论: 实际应收超过标准套餐金额5%进入超套预警，标准套餐来源需项目确认。
  适用场景: 工作手机,账务
  来源项目: GEHC
  关联组件: RULE-003
  AI使用方式: 账务类项目自动加入超套规则
  是否可复用: true
- 知识卡片编号: KC-009
  主题: 租赁到期回收
  核心结论: 租赁到期前30天启动催办，续租/买断/回收三路径需客户书面确认。
  适用场景: 终端租赁
  来源项目: 强生Vision
  关联组件: SOP-202,RULE-201
  AI使用方式: 租赁类画像匹配到期流程
  是否可复用: true
- 知识卡片编号: KC-010
  主题: AI Brief人工确认
  核心结论: AI审查输出必须经PM确认后写入差异表或知识卡片，不可直接作为客户承诺。
  适用场景: 所有项目
  来源项目: 通用
  关联组件: TPL-402
  AI使用方式: 生成Brief后提示五项审查问题
  是否可复用: true
- 知识卡片编号: KC-011
  主题: 号码改号运营商时长
  核心结论: 改号涉及运营商侧流程，需预留5-10工作日并确认旧号销号时点。
  适用场景: 工作手机,单卡
  来源项目: GEHC
  关联组件: SOP-004
  AI使用方式: 涉及改号时提示时效风险
  是否可复用: true
- 知识卡片编号: KC-012
  主题: 月报管理价值表达
  核心结论: 月报应从事件/资产/账单数据提炼管理价值，而非仅罗列数字。
  适用场景: 月报,客户汇报
  来源项目: 礼来
  关联组件: RPT-301
  AI使用方式: 月报Prompt模板引用
  是否可复用: true
