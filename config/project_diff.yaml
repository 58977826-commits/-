# 项目差异规则表（标准逻辑 vs 本项目实际）
# init-db / tem sync-diff 会同步到 DuckDB meta_project_diff。
# 运营确认后的差异应记录在此，供 Import Gate 提示与 AI 知识回流。

# 全局默认差异（所有项目继承，可被 projects 下条目覆盖同规则ID）
defaults:
  - 规则ID: DATA-001
    规则类别: 字段映射
    标准规则: 账单清单主键列为「服务号码」
    本项目规则: 联通导出明细 sheet 使用「号码」，经 field_maps 映射为服务号码
    确认方: 系统
    是否可复用: true
    备注: 202604 联通实单已验证

  - 规则ID: DATA-002
    规则类别: 字段映射
    标准规则: 清单金额字段为「计费应收」
    本项目规则: 联通清单使用「月费应收」，映射至计费应收
    确认方: 账务/TEM
    是否可复用: true

  - 规则ID: DATA-003
    规则类别: 导入策略
    标准规则: 平台字段（客户ID/项目ID/账期）以 CLI/页面上下文为准
    本项目规则: Excel 内客户标识/账期若与上下文不一致，Import Gate 报错
    确认方: 运营经理
    是否可复用: true

  - 规则ID: MATCH-001
    规则类别: 跨表匹配
    标准规则: 资产⇔人员优先按员工ID，其次邮箱
    本项目规则: 资产表保留「员工编号」字段，匹配时等价于员工ID
    确认方: PM
    是否可复用: true

# 按客户/项目覆盖或追加
projects:
  - 客户ID: johnson
    项目ID: work-phone
    diffs:
      - 规则ID: BILL-JNJ-001
        规则类别: 账单结构
        标准规则: 账单 workbook 分「清单」「明细」两个 sheet
        本项目规则: 强生/礼来联通账单均为双 sheet；无 sheet 关键字时不得默认当清单
        确认方: 运营经理
        是否可复用: true
        生效账期: null
